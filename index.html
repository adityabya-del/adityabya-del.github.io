<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClearBerth — Trains, Made Clear</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(180deg, #425CF5 0%, #3046D2 100%);
    color: white;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  .badge {
    background: #FF6F4A;
    padding: 10px 28px;
    border-radius: 30px;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.5px;
    margin-bottom: 24px;
    display: inline-block;
  }
  h1 {
    font-size: 48px;
    font-weight: 800;
    margin-bottom: 8px;
  }
  .tagline {
    color: #FFBEA0;
    font-weight: 700;
    letter-spacing: 1px;
    font-size: 15px;
    margin-bottom: 40px;
  }
  .features {
    color: rgba(255,255,255,0.9);
    font-size: 16px;
    margin-bottom: 32px;
    line-height: 1.8;
  }
  .links {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 40px;
  }
  .links a {
    background: white;
    color: #3046D2;
    padding: 14px 28px;
    border-radius: 12px;
    text-decoration: none;
    font-weight: 700;
    font-size: 15px;
  }
  .links a.secondary {
    background: rgba(255,255,255,0.15);
    color: white;
    border: 1px solid rgba(255,255,255,0.3);
  }
  footer {
    color: rgba(255,255,255,0.6);
    font-size: 13px;
    margin-top: 20px;
  }
  footer a { color: rgba(255,255,255,0.8); }
</style>
</head>
<body>
  <div class="badge">NOW LIVE ON APP STORE</div>
  <h1>ClearBerth</h1>
  <div class="tagline">TRAINS, MADE CLEAR</div>
  <div class="features">
    PNR status with a visual seat diagram &middot; Live train tracking<br>
    Boarding &amp; arrival alerts &middot; Built for Indian Railways travellers
  </div>
  <div class="links">
    <a href="https://apps.apple.com/in/app/clearberth/id6802574946">Download on the App Store</a>
    <a class="secondary" href="https://play.google.com/store/apps/details?id=com.aditya.clearberth">Get it on Google Play</a>
  </div>
  <footer>
    <a href="/clearberth/privacy.htm">Privacy Policy</a> &nbsp;&middot;&nbsp;
    <a href="mailto:clearberth.support@gmail.com">Contact Support</a>
  </footer>
</body>
</html>
